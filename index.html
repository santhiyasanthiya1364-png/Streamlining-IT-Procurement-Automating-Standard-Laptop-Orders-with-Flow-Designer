<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>IT Procurement Automation</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <header>
        <h1>IT Procurement Automation</h1>
        <p>Standard Laptop Orders with Flow Designer</p>
    </header>

    <main>
        <section class="card">
            <h2>Standard Laptop Request</h2>

            <form id="laptopForm">
                <label>Employee Name</label>
                <input type="text" id="employee" placeholder="Enter employee name" required>

                <label>Department</label>
                <select id="department" required>
                    <option value="">Select department</option>
                    <option>IT</option>
                    <option>HR</option>
                    <option>Finance</option>
                    <option>Marketing</option>
                </select>

                <label>Laptop Model</label>
                <select id="laptop" required>
                    <option value="">Select standard laptop</option>
                    <option value="Standard Business Laptop">Standard Business Laptop</option>
                    <option value="Developer Laptop">Developer Laptop</option>
                    <option value="Office Laptop">Office Laptop</option>
                </select>

                <label>Quantity</label>
                <input type="number" id="quantity" min="1" max="10" value="1" required>

                <button type="submit">Submit Laptop Request</button>
            </form>
        </section>

        <section class="card">
            <h2>Flow Status</h2>
            <div id="statusBox">
                <p>No request submitted yet.</p>
            </div>
        </section>

        <section class="card">
            <h2>Automation Flow</h2>
            <div class="flow">
                <div>Request Submitted</div>
                <span>→</span>
                <div>Validate Request</div>
                <span>→</span>
                <div>Approval</div>
                <span>→</span>
                <div>Order Ready</div>
            </div>
        </section>
    </main>

    <footer>
        <p>IT Procurement Automation Project</p>
    </footer>

    <script src="script.js"></script>
</body>
</html>
